[package]
name = "mpd"
version = "1.0.0"
edition = "2021"
authors = ["MPD Contributors"]
description = "MPD (Multi-Protocol Downloader) - Modern, fast cross-platform media downloader desktop application and CLI for Windows, macOS, and Linux"
license = "MIT"
repository = "https://github.com/mpd-downloader/mpd"
readme = "README.md"
keywords = ["media-downloader", "yt-dlp", "video-downloader", "audio-downloader", "cross-platform"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities", "gui"]

[[bin]]
name = "mpd"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
    "accesskit",
] }
egui_extras = { version = "0.31", features = ["all_loaders", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
open = "5"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
arboard = "3.4"
futures-util = "0.3"
flate2 = "1.1"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
